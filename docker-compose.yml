services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: mdfedit-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
      MSSQL_PID: Developer
      TZ: Asia/Taipei
    ports:
      - "11433:1433"
    volumes:
      - ./data:/var/opt/mssql/data
      - ./scripts:/scripts:ro
    restart: unless-stopped
